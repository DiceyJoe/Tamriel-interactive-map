<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TES Atlas">
  <title>The Elder Scrolls: Map &amp; Timeline</title>
  <style>
    :root {
      --bg: #0c0f14;
      --panel: #151a22;
      --light: #1e2530;
      --gold: #d4af37;
      --dim: #9c7f24;
      --text: #e8e6e1;
      --muted: #9aa0a6;
      --border: #2c3545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      min-height: 100dvh;
    }
    header {
      text-align: center;
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #161b24 0%, #0c0f14 100%);
    }
    header h1 { font-size: 1.35rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
    header p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      max-width: 150px;
      background: var(--light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--gold); color: #0c0f14; border-color: var(--gold); }
    .section { display: none; padding: 14px; max-width: 820px; margin: 0 auto; }
    .section.active { display: block; }
    .hint { text-align: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
    .map-box {
      position: relative;
      width: 100%;
      height: 52dvh;
      min-height: 340px;
      max-height: 480px;
      background: radial-gradient(circle at center, #142233 0%, #09101a 100%);
      border: 1px solid var(--dim);
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
    }
    .zoom-ui { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .z-btn {
      width: 40px;
      height: 40px;
      background: rgba(21, 26, 34, 0.94);
      color: var(--gold);
      border: 1px solid var(--dim);
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }
    svg#map { width: 100%; height: 100%; display: block; }
    .prov { stroke: #1b222c; stroke-width: 1.5; cursor: pointer; }
    .prov.selected { stroke: var(--gold); stroke-width: 2.5; filter: brightness(1.22); }
    .lbl { font-size: 9px; font-weight: 700; fill: #fff; text-anchor: middle; letter-spacing: 0.6px; pointer-events: none; }
    .city { font-size: 6.8px; fill: #f5e6b3; text-anchor: middle; pointer-events: none; }
    .realm-bar, .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; margin-bottom: 12px; }
    .pill-btn {
      background: var(--panel);
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn.active { background: var(--gold); color: #0c0f14; border-color: var(--gold); }
    .card {
      margin-top: 12px;
      background: var(--panel);
      border: 1px solid var(--dim);
      border-radius: 10px;
      padding: 15px;
    }
    .card h2 { color: var(--gold); font-size: 1.15rem; margin-bottom: 4px; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .card p { font-size: 0.9rem; color: var(--text); }
    .item {
      background: var(--panel);
      border-left: 3px solid var(--gold);
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 0 8px 8px 0;
    }
    .badge {
      display: inline-block;
      background: var(--light);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .item h3 { font-size: 1rem; color: #fff; }
    .item p { font-size: 0.86rem; color: #cfd3da; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>The Elder Scrolls</h1>
    <p>Atlas of Nirn &amp; Chronological Lore Explorer</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="map-sec">Map of Nirn</button>
    <button class="tab-btn" data-tab="era-sec">Eras &amp; Events</button>
    <button class="tab-btn" data-tab="game-sec">Game Order</button>
  </nav>
